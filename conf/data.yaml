# Up-front splits and data sources for stage 2. Changing any split value changes which
# comments and annotators are held out, so treat edits as a new data version.
seed: 20261125

# Comment-level splits. Comments are keyed by the hash of their normalized text, so every id
# sharing a text lands in the same split. Order matters.
comment_splits:
  train: 0.8
  validation: 0.1
  search: 0.1

# Held-out annotators (chosen by hash of worker id) never contribute labels to train, validation
# or search. Their labels train a held-out rater model, which scores rewrites as one of the
# trusted sources, so they need enough labels to train a competent rater.
# Both stay null until the data_profile run (notebooks/01_ingest.py) has been reviewed.
heldout_annotator_fraction: null
min_heldout_annotations: null
# Fractions the profile reports label and worker shares for.
candidate_heldout_fractions: [0.05, 0.1, 0.15, 0.2]

# Source comments for the search stage, drawn from the search split using training-annotator
# labels only. Spread across clusters is deferred until clusters exist (stage 3).
search_sources:
  count: 200
  toxicity_threshold: 0.5
  min_annotators: 3

kaggle:
  competition: jigsaw-unintended-bias-in-toxicity-classification
  comments_file: all_data.csv
  annotations_file: toxicity_individual_annotations.csv
  secret_scope: kaggle
  token_key: api_token

huggingface:
  repo_id: ucberkeley-dlab/measuring-hate-speech
